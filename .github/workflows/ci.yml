name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm format:check
            - run: pnpm types:check
            - run: pnpm lint
            - run: pnpm test
            - run: pnpm build

    version:
        needs: check
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        outputs:
            new: ${{ steps.release.outputs.new }}
        steps:
            - uses: actions/checkout@v7
            - id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  if gh release view "$version" > /dev/null 2>&1; then
                      echo "$version is already released, nothing to deploy"
                      echo "new=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "$version is new"
                      echo "new=true" >> "$GITHUB_OUTPUT"
                  fi

    release:
        needs: version
        if: github.event_name == 'push' && needs.version.outputs.new == 'true'
        runs-on: ubuntu-latest
        concurrency:
            group: release
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm db:migrate:remote
              env:
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            - run: pnpm deploy:prod
              env:
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    storybook:
        needs: [version, release]
        if: github.event_name == 'push' && needs.version.outputs.new == 'true'
        runs-on: ubuntu-latest
        concurrency:
            group: storybook
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm deploy:storybook
              env:
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    tag:
        needs: [version, release]
        if: github.event_name == 'push' && needs.version.outputs.new == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  if gh release view "$version" > /dev/null 2>&1; then
                      echo "$version is already released"
                  else
                      gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes
                  fi
