<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- Only the origin goes along with a request, never a path such as the link of an invitation -->
        <meta name="referrer" content="strict-origin" />
        <title>Tarja</title>
        <meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
        <script>
            // Puts the saved theme on the page before it paints, so a choice other than the default (light) doesn't
            // flash. The key and the values are those of src/lib/theme.
            var theme = 'light';
            try {
                var saved = localStorage.getItem('tarja:theme');
                if (saved === 'dark' || saved === 'system') {
                    theme = saved;
                    document.documentElement.dataset.theme = theme;
                }
            } catch (error) {
                // Storage can be blocked: the defaults then apply until the app starts
            }
            // An explicit theme points every toolbar color at its own header surface, as syncThemeColor does later,
            // keeping the per-preference colors for "system"
            if (theme !== 'system') {
                var surface = document.querySelector(
                    'meta[name="theme-color"][media="(prefers-color-scheme: ' + theme + ')"]'
                );
                var metas = document.querySelectorAll('meta[name="theme-color"]');
                for (var i = 0; surface && i < metas.length; i++) {
                    metas[i].dataset.default = metas[i].content;
                    metas[i].content = surface.content;
                }
            }
        </script>
        <meta name="description" content="Log your everyday expenses: food, groceries, leisure, bills and rent." />
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
        <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
